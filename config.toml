[teos_engine]
mode = "sovereign"
audit_log = "AUDIT_INDEX.md"

[gateway]
# Upstream TEOS-AI-Engine (deployed on Vercel). Used only when TEOS_API_KEY
# (or TEOS_AI_API_KEY) is present in the environment; otherwise the sovereign
# local provider below is used so the forge never silently degrades.
teos_ai_endpoint = "https://teos-ai-engine.vercel.app/api/v1"

# Sovereign local provider (fallback path)
llm_provider = "ollama"        # ollama | (extensible)
ollama_endpoint = "http://localhost:11434"
ollama_model = "llama3.2"

# Text-to-speech
tts_provider = "edge"
tts_voice = "en-US-ChristopherNeural"

# Local transcription (openai-whisper, on-device). tiny/base for speed.
whisper_model = "tiny"
whisper_language = "en"

[compliance]
ert_filter = true
icbc_governance = true
visibility_scoring = true

[source_policy]
# Official Elmahrosa sources only — the restricted-script gateway must never
# cite anything outside this allowlist.
allowed_domains = [
  "elmahrosa.com",
  "teosegypt.com",
  "github.com/Elmahrosa",
]

[vault]
# Sovereign Media Vault — all visual assets live on-device, never fetched.
directory = "assets/sovereign_vault"
# Each matched asset fills one slice; longer videos cycle the vault.
slice_seconds = 6
# Ken Burns zoom strength per slice (0.12 = gentle 12% drift).
zoom = 0.12

[video]
# Vertical short-form canvas (9:16). TEOS branded dark blue/black background.
width = 1080
height = 1920
fps = 30
background = [8, 10, 22]
# Leave empty to auto-resolve a system font for the burned-in subtitles.
subtitle_font = ""
# x264 speed/size trade-off: ultrafast < veryfast < faster < medium.
encoder_preset = "veryfast"
crf = 28